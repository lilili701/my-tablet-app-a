<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>平板使用時間與點數紀錄器</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: #f8fafc;
        }
        .preset-btn {
            transition: all 0.2s ease;
        }
        .preset-btn:active {
            transform: scale(0.96);
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen pb-12">

    <!-- Header Navigation -->
    <header class="bg-indigo-600 text-white shadow-md">
        <div class="max-w-3xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-white/20 p-2.5 rounded-xl">
                    <i class="fa-solid fa-tablet-screen-button text-2xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold leading-tight">平板使用點數存摺</h1>
                    <p class="text-xs text-indigo-200">單機永久保存 ‧ 支援離線與跨裝置匯入</p>
                </div>
            </div>
            <!-- Status indicator -->
            <div class="flex items-center space-x-1.5 text-xs bg-indigo-700/60 px-3 py-1.5 rounded-full border border-indigo-500/30">
                <span class="w-2.5 h-2.5 rounded-full bg-emerald-400"></span>
                <span>資料正常儲存中</span>
            </div>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 mt-6 space-y-6">

        <!-- Storage & Cross Device Management Card -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-4 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center font-bold">
                    <i class="fa-solid fa-hard-drive"></i>
                </div>
                <div>
                    <div class="text-xs text-slate-500 font-medium">資料保存狀態</div>
                    <div class="font-mono text-sm font-bold text-slate-700" id="displayDeviceStatus">本機已安全保存紀錄</div>
                </div>
            </div>
            <div class="flex items-center space-x-2 self-end sm:self-auto">
                <button onclick="openExportModal()" class="text-xs bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-200 px-3 py-2 rounded-lg transition font-medium flex items-center space-x-1">
                    <i class="fa-solid fa-file-export"></i>
                    <span>匯出資料 (傳給其他裝置)</span>
                </button>
                <button onclick="openImportModal()" class="text-xs bg-indigo-600 hover:bg-indigo-700 text-white px-3.5 py-2 rounded-lg transition font-medium flex items-center space-x-1.5 shadow-sm">
                    <i class="fa-solid fa-file-import"></i>
                    <span>匯入資料</span>
                </button>
            </div>
        </div>

        <!-- Total Score Overview Card -->
        <div class="bg-gradient-to-br from-indigo-500 via-indigo-600 to-purple-600 rounded-3xl p-6 text-white shadow-xl shadow-indigo-100">
            <div class="flex justify-between items-start">
                <div>
                    <p class="text-indigo-100 text-sm font-medium">當前累積點數 / 時間</p>
                    <div class="flex items-baseline space-x-2 mt-1">
                        <span id="totalPoints" class="text-5xl font-extrabold tracking-tight">0</span>
                        <span class="text-lg text-indigo-200">點</span>
                    </div>
                </div>
                <div class="bg-white/10 backdrop-blur-md px-4 py-2.5 rounded-2xl text-right">
                    <span class="text-xs text-indigo-100 block">預估可使用時間</span>
                    <span id="estimatedTime" class="text-xl font-bold text-yellow-300">0 分鐘</span>
                </div>
            </div>
            <div class="mt-4 pt-4 border-t border-white/10 flex justify-between text-xs text-indigo-100">
                <span><i class="fa-solid fa-arrow-up text-emerald-300 mr-1"></i>總加分: <strong id="totalAdded" class="text-white">0</strong></span>
                <span><i class="fa-solid fa-arrow-down text-rose-300 mr-1"></i>總扣分: <strong id="totalDeducted" class="text-white">0</strong></span>
                <span><i class="fa-solid fa-list-check mr-1"></i>紀錄數: <strong id="totalCount" class="text-white">0</strong></span>
            </div>
        </div>

        <!-- Quick Presets Section -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-5 space-y-4">
            <h2 class="text-base font-bold text-slate-800 flex items-center">
                <i class="fa-solid fa-bolt text-amber-500 mr-2"></i>常用快捷登錄
            </h2>

            <!-- Add Points Presets -->
            <div>
                <span class="text-xs font-semibold text-emerald-600 bg-emerald-50 px-2.5 py-1 rounded-md mb-2 inline-block">
                    <i class="fa-solid fa-plus mr-1"></i>常用加分項目
                </span>
                <div class="grid grid-cols-2 gap-3 mt-1.5">
                    <button onclick="applyPreset('分衣服', 10, 'plus', '幫忙分類整理好的衣服')" class="preset-btn bg-emerald-50 border border-emerald-200 hover:bg-emerald-100 text-emerald-800 rounded-xl p-3 text-left flex justify-between items-center">
                        <div>
                            <div class="font-bold text-sm">👕 分衣服</div>
                            <div class="text-xs text-emerald-600 mt-0.5">預設 +10 點</div>
                        </div>
                        <i class="fa-solid fa-circle-plus text-emerald-500 text-lg"></i>
                    </button>
                    <button onclick="applyPreset('妹吹頭', 10, 'plus', '幫妹妹吹乾頭髮')" class="preset-btn bg-emerald-50 border border-emerald-200 hover:bg-emerald-100 text-emerald-800 rounded-xl p-3 text-left flex justify-between items-center">
                        <div>
                            <div class="font-bold text-sm">👧 妹吹頭</div>
                            <div class="text-xs text-emerald-600 mt-0.5">預設 +10 點</div>
                        </div>
                        <i class="fa-solid fa-circle-plus text-emerald-500 text-lg"></i>
                    </button>
                </div>
            </div>

            <!-- Deduct Points Presets -->
            <div>
                <span class="text-xs font-semibold text-rose-600 bg-rose-50 px-2.5 py-1 rounded-md mb-2 inline-block">
                    <i class="fa-solid fa-minus mr-1"></i>常用扣分項目
                </span>
                <div class="grid grid-cols-2 gap-3 mt-1.5">
                    <button onclick="applyPreset('使用', 15, 'minus', '使用平板 15 分鐘')" class="preset-btn bg-rose-50 border border-rose-200 hover:bg-rose-100 text-rose-800 rounded-xl p-3 text-left flex justify-between items-center">
                        <div>
                            <div class="font-bold text-sm">📱 使用平板</div>
                            <div class="text-xs text-rose-600 mt-0.5">預設 -15 點</div>
                        </div>
                        <i class="fa-solid fa-circle-minus text-rose-500 text-lg"></i>
                    </button>
                    <button onclick="applyPreset('超時', 10, 'minus', '未按時歸還平板懲罰')" class="preset-btn bg-rose-50 border border-rose-200 hover:bg-rose-100 text-rose-800 rounded-xl p-3 text-left flex justify-between items-center">
                        <div>
                            <div class="font-bold text-sm">⏰ 超時懲罰</div>
                            <div class="text-xs text-rose-600 mt-0.5">預設 -10 點</div>
                        </div>
                        <i class="fa-solid fa-circle-minus text-rose-500 text-lg"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Custom Record Form -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-5">
            <h2 class="text-base font-bold text-slate-800 mb-4 flex items-center">
                <i class="fa-solid fa-pen-to-square text-indigo-500 mr-2"></i>新增／編輯項目
            </h2>

            <form id="recordForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
                <input type="hidden" id="editDocId" value="">

                <!-- Type Selector (Add / Deduct) -->
                <div class="grid grid-cols-2 gap-3">
                    <label class="cursor-pointer">
                        <input type="radio" name="recordType" value="plus" id="typePlus" class="peer hidden" checked onchange="updateFormTheme()">
                        <div class="border-2 border-slate-200 peer-checked:border-emerald-500 peer-checked:bg-emerald-50 peer-checked:text-emerald-700 text-slate-600 rounded-xl p-2.5 text-center font-bold text-sm transition flex items-center justify-center space-x-1.5">
                            <i class="fa-solid fa-circle-plus text-emerald-500"></i>
                            <span>加分 (+)</span>
                        </div>
                    </label>
                    <label class="cursor-pointer">
                        <input type="radio" name="recordType" value="minus" id="typeMinus" class="peer hidden" onchange="updateFormTheme()">
                        <div class="border-2 border-slate-200 peer-checked:border-rose-500 peer-checked:bg-rose-50 peer-checked:text-rose-700 text-slate-600 rounded-xl p-2.5 text-center font-bold text-sm transition flex items-center justify-center space-x-1.5">
                            <i class="fa-solid fa-circle-minus text-rose-500"></i>
                            <span>扣分 (-)</span>
                        </div>
                    </label>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <!-- Title Input -->
                    <div class="sm:col-span-2">
                        <label class="block text-xs font-semibold text-slate-600 mb-1">項目名稱</label>
                        <input type="text" id="titleInput" required placeholder="請輸入或選擇常用項目" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition">
                    </div>

                    <!-- Points Input -->
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">點數數值</label>
                        <input type="number" id="pointsInput" min="1" step="1" required placeholder="如: 10" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition">
                    </div>
                </div>

                <!-- Note Input -->
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">備註說明 (選填)</label>
                    <input type="text" id="noteInput" placeholder="例如：協助完成 3 件衣物、逾時 5 分鐘..." class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition">
                </div>

                <!-- Submit & Cancel Buttons -->
                <div class="flex space-x-2 pt-1">
                    <button type="submit" id="submitBtn" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-xl shadow-md transition flex items-center justify-center space-x-1.5 text-sm">
                        <i class="fa-solid fa-check"></i>
                        <span id="submitBtnText">確認登記</span>
                    </button>
                    <button type="button" id="cancelEditBtn" onclick="resetForm()" class="hidden bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold px-4 py-2.5 rounded-xl transition text-sm">
                        取消
                    </button>
                </div>
            </form>
        </div>

        <!-- Transaction History Logs -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-5 space-y-4">
            <div class="flex justify-between items-center">
                <h2 class="text-base font-bold text-slate-800 flex items-center">
                    <i class="fa-solid fa-clock-rotate-left text-slate-500 mr-2"></i>異動歷史紀錄
                </h2>
                <div class="flex items-center space-x-2">
                    <span class="text-xs text-slate-400" id="recordCountText">共 0 筆</span>
                    <button onclick="clearAllData()" class="text-xs text-rose-500 hover:text-rose-700 hover:underline">清空所有</button>
                </div>
            </div>

            <div id="logsContainer" class="space-y-3">
                <!-- Log List rendered dynamically -->
            </div>
        </div>

    </main>

    <!-- Export Modal -->
    <div id="exportModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center z-50 hidden p-4">
        <div class="bg-white rounded-3xl p-6 max-w-md w-full shadow-2xl space-y-4">
            <div class="flex justify-between items-center">
                <h3 class="text-lg font-bold text-slate-800 flex items-center">
                    <i class="fa-solid fa-file-export text-emerald-600 mr-2"></i>匯出／同步至其他裝置
                </h3>
                <button onclick="closeExportModal()" class="text-slate-400 hover:text-slate-600">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
            <p class="text-xs text-slate-500 leading-relaxed">
                將以下生成的「同步代碼」複製，並在另一台手機/平板點選「匯入資料」貼上，即可完全同步所有數據：
            </p>
            <div>
                <textarea id="exportDataText" readonly rows="4" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl font-mono text-xs focus:outline-none break-all text-slate-600"></textarea>
            </div>
            <div class="flex space-x-2 pt-1">
                <button onclick="copyExportText()" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-xl shadow-md transition text-sm flex items-center justify-center space-x-1">
                    <i class="fa-regular fa-copy"></i>
                    <span>複製同步代碼</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Import Modal -->
    <div id="importModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center z-50 hidden p-4">
        <div class="bg-white rounded-3xl p-6 max-w-md w-full shadow-2xl space-y-4">
            <div class="flex justify-between items-center">
                <h3 class="text-lg font-bold text-slate-800 flex items-center">
                    <i class="fa-solid fa-file-import text-indigo-600 mr-2"></i>匯入其他裝置的資料
                </h3>
                <button onclick="closeImportModal()" class="text-slate-400 hover:text-slate-600">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
            <p class="text-xs text-slate-500 leading-relaxed">
                貼上從其他裝置複製過來的「同步代碼」：
            </p>
            <div>
                <textarea id="importDataText" rows="4" placeholder="在此處貼上代碼..." class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl font-mono text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
            </div>
            <div class="flex space-x-2 pt-1">
                <button onclick="processImportData()" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-xl shadow-md transition text-sm">
                    確認匯入並覆蓋本機
                </button>
            </div>
        </div>
    </div>

    <!-- Custom Notification Toast -->
    <div id="toast" class="fixed bottom-5 right-5 transform translate-y-20 opacity-0 transition-all duration-300 bg-slate-900 text-white px-4 py-3 rounded-2xl shadow-2xl flex items-center space-x-3 z-50 pointer-events-none">
        <i id="toastIcon" class="fa-solid fa-circle-check text-emerald-400 text-lg"></i>
        <span id="toastMsg" class="text-sm font-medium">提示訊息</span>
    </div>

    <script>
        // Data Store (LocalStorage)
        const STORAGE_KEY = 'tablet_points_records_v1';
        let allRecords = [];

        // Load Records from local storage
        function loadRecords() {
            try {
                const data = localStorage.getItem(STORAGE_KEY);
                allRecords = data ? JSON.parse(data) : [];
            } catch (e) {
                console.error("Load storage error:", e);
                allRecords = [];
            }
            renderApp(allRecords);
        }

        // Save Records to local storage
        function saveRecords() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(allRecords));
            } catch (e) {
                console.error("Save storage error:", e);
            }
            renderApp(allRecords);
        }

        // Form Submit
        function handleFormSubmit(e) {
            e.preventDefault();

            const docId = document.getElementById('editDocId').value;
            const type = document.querySelector('input[name="recordType"]:checked').value;
            const title = document.getElementById('titleInput').value.trim();
            const points = parseInt(document.getElementById('pointsInput').value, 10);
            const note = document.getElementById('noteInput').value.trim();

            if (!title || isNaN(points) || points <= 0) {
                showToast("請輸入有效的名稱與點數", "error");
                return;
            }

            if (docId) {
                // Update existing record
                const index = allRecords.findIndex(r => r.id === docId);
                if (index !== -1) {
                    allRecords[index].type = type;
                    allRecords[index].title = title;
                    allRecords[index].points = points;
                    allRecords[index].note = note;
                    showToast("紀錄更新成功！", "success");
                }
            } else {
                // Add new record
                const newRecord = {
                    id: 'rec-' + Date.now() + '-' + Math.random().toString(36).substring(2, 6),
                    type,
                    title,
                    points,
                    note,
                    timestamp: Date.now()
                };
                allRecords.unshift(newRecord);
                showToast(`已登記 ${type === 'plus' ? '+' : '-'}${points} 點！`, "success");
            }

            saveRecords();
            resetForm();
        }

        // Render UI
        function renderApp(records) {
            const logsContainer = document.getElementById('logsContainer');
            const totalPointsEl = document.getElementById('totalPoints');
            const estimatedTimeEl = document.getElementById('estimatedTime');
            const totalAddedEl = document.getElementById('totalAdded');
            const totalDeductedEl = document.getElementById('totalDeducted');
            const totalCountEl = document.getElementById('totalCount');
            const recordCountText = document.getElementById('recordCountText');

            let totalPoints = 0;
            let totalAdded = 0;
            let totalDeducted = 0;

            records.forEach(r => {
                const pts = Number(r.points) || 0;
                if (r.type === 'plus') {
                    totalPoints += pts;
                    totalAdded += pts;
                } else {
                    totalPoints -= pts;
                    totalDeducted += pts;
                }
            });

            totalPointsEl.innerText = totalPoints;
            estimatedTimeEl.innerText = `${Math.max(0, totalPoints)} 分鐘`;
            totalAddedEl.innerText = `+${totalAdded}`;
            totalDeductedEl.innerText = `-${totalDeducted}`;
            totalCountEl.innerText = records.length;
            recordCountText.innerText = `共 ${records.length} 筆`;

            if (records.length === 0) {
                logsContainer.innerHTML = `
                    <div class="text-center py-10 text-slate-400 bg-slate-50 rounded-xl border border-dashed border-slate-200">
                        <i class="fa-solid fa-folder-open text-3xl mb-2 text-slate-300"></i>
                        <p class="text-sm">目前尚無任何紀錄，點擊快捷鈕或輸入資料開始吧！</p>
                    </div>
                `;
                return;
            }

            logsContainer.innerHTML = records.map(r => {
                const isPlus = r.type === 'plus';
                const formattedDate = r.timestamp 
                    ? new Date(r.timestamp).toLocaleString('zh-TW', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }) 
                    : '處理中...';

                return `
                    <div class="p-3.5 rounded-xl border ${isPlus ? 'border-emerald-100 bg-emerald-50/30' : 'border-rose-100 bg-rose-50/30'} flex justify-between items-center transition hover:shadow-sm">
                        <div class="flex items-start space-x-3">
                            <div class="w-9 h-9 rounded-full flex items-center justify-center font-bold text-sm ${isPlus ? 'bg-emerald-100 text-emerald-600' : 'bg-rose-100 text-rose-600'} flex-shrink-0 mt-0.5">
                                <i class="fa-solid ${isPlus ? 'fa-plus' : 'fa-minus'}"></i>
                            </div>
                            <div>
                                <div class="flex items-center space-x-2">
                                    <span class="font-bold text-slate-800 text-sm">${escapeHtml(r.title)}</span>
                                    <span class="text-[11px] text-slate-400">${formattedDate}</span>
                                </div>
                                ${r.note ? `<p class="text-xs text-slate-500 mt-0.5"><i class="fa-regular fa-note-sticky mr-1"></i>${escapeHtml(r.note)}</p>` : ''}
                            </div>
                        </div>
                        <div class="flex items-center space-x-3">
                            <span class="text-base font-extrabold ${isPlus ? 'text-emerald-600' : 'text-rose-600'}">
                                ${isPlus ? '+' : '-'}${r.points} 點
                            </span>
                            <div class="flex items-center space-x-1">
                                <button onclick="editRecord('${r.id}')" title="編輯" class="text-slate-400 hover:text-indigo-600 p-1.5 rounded-lg hover:bg-slate-100 transition">
                                    <i class="fa-solid fa-pen text-xs"></i>
                                </button>
                                <button onclick="deleteRecord('${r.id}')" title="刪除" class="text-slate-400 hover:text-rose-600 p-1.5 rounded-lg hover:bg-slate-100 transition">
                                    <i class="fa-solid fa-trash-can text-xs"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        // Preset Application
        function applyPreset(title, points, type, note) {
            document.getElementById('editDocId').value = '';
            document.getElementById('titleInput').value = title;
            document.getElementById('pointsInput').value = points;
            document.getElementById('noteInput').value = note || '';

            if (type === 'plus') {
                document.getElementById('typePlus').checked = true;
            } else {
                document.getElementById('typeMinus').checked = true;
            }

            updateFormTheme();
            document.getElementById('titleInput').focus();
            showToast(`已載入「${title}」項目`, "info");
        }

        function editRecord(id) {
            const target = allRecords.find(r => r.id === id);
            if (!target) return;

            document.getElementById('editDocId').value = target.id;
            document.getElementById('titleInput').value = target.title || '';
            document.getElementById('pointsInput').value = target.points || '';
            document.getElementById('noteInput').value = target.note || '';

            if (target.type === 'plus') {
                document.getElementById('typePlus').checked = true;
            } else {
                document.getElementById('typeMinus').checked = true;
            }

            updateFormTheme();
            document.getElementById('submitBtnText').innerText = '儲存修改';
            document.getElementById('cancelEditBtn').classList.remove('hidden');
            window.scrollTo({ top: 200, behavior: 'smooth' });
        }

        function deleteRecord(id) {
            allRecords = allRecords.filter(r => r.id !== id);
            saveRecords();
            showToast("已刪除紀錄", "info");
        }

        function clearAllData() {
            if (allRecords.length === 0) return;
            allRecords = [];
            saveRecords();
            showToast("已清空所有數據", "info");
        }

        function resetForm() {
            document.getElementById('recordForm').reset();
            document.getElementById('editDocId').value = '';
            document.getElementById('typePlus').checked = true;
            document.getElementById('submitBtnText').innerText = '確認登記';
            document.getElementById('cancelEditBtn').classList.add('hidden');
            updateFormTheme();
        }

        function updateFormTheme() {
            const isPlus = document.getElementById('typePlus').checked;
            const submitBtn = document.getElementById('submitBtn');
            if (isPlus) {
                submitBtn.className = "flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-xl shadow-md transition flex items-center justify-center space-x-1.5 text-sm";
            } else {
                submitBtn.className = "flex-1 bg-rose-600 hover:bg-rose-700 text-white font-bold py-2.5 rounded-xl shadow-md transition flex items-center justify-center space-x-1.5 text-sm";
            }
        }

        // Export / Import Modals
        function openExportModal() {
            const b64 = btoa(encodeURIComponent(JSON.stringify(allRecords)));
            document.getElementById('exportDataText').value = b64;
            document.getElementById('exportModal').classList.remove('hidden');
        }

        function closeExportModal() {
            document.getElementById('exportModal').classList.add('hidden');
        }

        function copyExportText() {
            const textarea = document.getElementById('exportDataText');
            textarea.select();
            document.execCommand('copy');
            showToast("已複製同步代碼，可在其他裝置匯入！", "success");
        }

        function openImportModal() {
            document.getElementById('importDataText').value = '';
            document.getElementById('importModal').classList.remove('hidden');
        }

        function closeImportModal() {
            document.getElementById('importModal').classList.add('hidden');
        }

        function processImportData() {
            const raw = document.getElementById('importDataText').value.trim();
            if (!raw) {
                showToast("請輸入有效的同步代碼", "error");
                return;
            }

            try {
                const jsonStr = decodeURIComponent(atob(raw));
                const parsed = JSON.parse(jsonStr);

                if (Array.isArray(parsed)) {
                    allRecords = parsed;
                    saveRecords();
                    closeImportModal();
                    showToast("匯入成功！數據已更新並同步。", "success");
                } else {
                    showToast("代碼格式不正確", "error");
                }
            } catch (err) {
                showToast("無法解析此代碼，請確認代碼完整", "error");
            }
        }

        function showToast(msg, type = "success") {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            const toastIcon = document.getElementById('toastIcon');

            toastMsg.innerText = msg;

            if (type === 'success') {
                toastIcon.className = "fa-solid fa-circle-check text-emerald-400 text-lg";
            } else if (type === 'error') {
                toastIcon.className = "fa-solid fa-circle-xmark text-rose-400 text-lg";
            } else {
                toastIcon.className = "fa-solid fa-circle-info text-sky-400 text-lg";
            }

            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 2500);
        }

        window.onload = function() {
            loadRecords();
        };
    </script>
</body>
</html>
